backend:
  name: git-gateway
  repo: unit6854/Marshall-Automotive
  branch: main

# `npx decap-server` + `npm run dev`, then visit http://localhost:4321/admin/
# to edit content locally without logging in. Set to false before going live.
local_backend: true

media_folder: "public/images"
public_folder: "/images"

publish_mode: simple
site_url: https://marshallsautomotive.netlify.app
display_url: https://marshallsautomotive.netlify.app
logo_url: /images/logo.webp

collections:
  # ------------------------------------------------------------------
  # GLOBAL SETTINGS — phone, address, hours, social links
  # ------------------------------------------------------------------
  - name: settings
    label: "Global Settings"
    files:
      - name: business
        label: "Business Info (Phone, Address, Hours)"
        file: "src/data/settings.json"
        description: "Phone number, address, hours and social links used across every page."
        fields:
          - { name: business_name, label: "Business Name", widget: string }
          - { name: tagline, label: "Location Tagline (under logo)", widget: string }
          - { name: logo, label: "Logo", widget: image }
          - { name: phone, label: "Phone Number (displayed)", widget: string }
          - { name: phone_link, label: "Phone Link (tel:)", widget: string, hint: "Format: tel:+16157321894" }
          - { name: email, label: "Email Address", widget: string }
          - { name: address_line1, label: "Address Line 1", widget: string }
          - { name: address_line2, label: "Address Line 2", widget: string }
          - { name: map_url, label: "Directions Link", widget: string }
          - { name: yelp_url, label: "Yelp URL", widget: string }
          - { name: yelp_rating, label: "Yelp Rating", widget: string }
          - { name: bbb_rating, label: "BBB Rating", widget: string }
          - { name: facebook_url, label: "Facebook URL", widget: string }
          - { name: footer_blurb, label: "Footer Blurb", widget: text }
          - name: hours
            label: "Shop Hours"
            widget: list
            fields:
              - { name: days, label: "Day", widget: string }
              - { name: time, label: "Hours", widget: string }

  # ------------------------------------------------------------------
  # PAGES — Home, About, Services, Contact
  # ------------------------------------------------------------------
  - name: pages
    label: "Pages"
    files:
      - name: home
        label: "Home Page"
        file: "src/data/home.json"
        fields:
          - { name: hero_image, label: "Hero Background Image", widget: image }
          - { name: hero_eyebrow, label: "Hero Small Text", widget: string }
          - { name: hero_title_line1, label: "Hero Headline Line 1 (white)", widget: string }
          - { name: hero_title_line2, label: "Hero Headline Line 2 (green)", widget: string }
          - { name: hero_text_line1, label: "Hero Paragraph Line 1", widget: string }
          - { name: hero_text_line2, label: "Hero Paragraph Line 2", widget: string }
          - { name: hero_button_label, label: "Hero Button Label", widget: string }
          - { name: hero_button_link, label: "Hero Button Link", widget: string }

          - name: features
            label: "Feature Strip (4 items)"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: ["technician", "shield", "gear", "stopwatch", "wrench", "clock"]
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }

          - { name: services_heading, label: "Services Heading", widget: string }
          - { name: services_subheading, label: "Services Subheading", widget: string }
          - { name: services_button_label, label: "Services Button Label", widget: string }

          - { name: why_heading, label: "Why Choose Us Heading", widget: string }
          - { name: why_points, label: "Why Choose Us Points", widget: list, field: { name: point, label: Point, widget: string } }
          - { name: why_image, label: "Mid-Page Image", widget: image }

          - { name: about_heading, label: "About Heading", widget: string }
          - { name: about_text, label: "About Text", widget: text }
          - { name: about_signature, label: "Signature", widget: string }
          - { name: about_owner, label: "Owner Line", widget: string }

          - { name: visit_heading, label: "Visit Us Heading", widget: string }
          - { name: visit_button_label, label: "Visit Us Button Label", widget: string }

          - { name: testimonials_heading, label: "Testimonials Heading", widget: string }
          - { name: testimonials_image, label: "Testimonials Background Image", widget: image }

          - { name: cta_line1, label: "CTA Line 1", widget: string }
          - { name: cta_line2, label: "CTA Line 2 (green)", widget: string }
          - { name: cta_text, label: "CTA Text", widget: string }
          - { name: cta_button_label, label: "CTA Button Label", widget: string }

      - name: about
        label: "About Page"
        file: "src/data/about.json"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: string }
          - { name: image, label: "Page Image", widget: image }
          - { name: body_1, label: "Paragraph 1", widget: text }
          - { name: body_2, label: "Paragraph 2", widget: text }
          - { name: body_3, label: "Paragraph 3", widget: text }
          - { name: values_image, label: "What We Stand For Background", widget: image }
          - { name: signature, label: "Signature", widget: string }
          - { name: owner, label: "Owner Line", widget: string }
          - name: values
            label: "What We Stand For"
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }

      - name: services
        label: "Services Page"
        file: "src/data/services.json"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: intro, label: Intro, widget: text }
          - name: services
            label: "Services"
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options:
                  ["engine", "brake", "oil", "tire", "transmission", "suspension", "snowflake", "dots", "wrench", "gear"]
              - { name: title, label: "Service Name", widget: string }
              - { name: image, label: "Thumbnail Image", widget: image, required: false }
              - { name: description, label: Description, widget: text }

      - name: contact
        label: "Contact / Booking Page"
        file: "src/data/contact.json"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: intro, label: Intro, widget: text }
          - { name: form_heading, label: "Form Heading", widget: string }
          - { name: form_note, label: "Form Note", widget: text }
          - { name: form_button_label, label: "Form Button Label", widget: string }
          - { name: reviews_title, label: "Reviews Page Title", widget: string }
          - { name: reviews_intro, label: "Reviews Page Intro", widget: text }

  # ------------------------------------------------------------------
  # REVIEWS / TESTIMONIALS
  # ------------------------------------------------------------------
  - name: reviews
    label: "Reviews / Testimonials"
    label_singular: "Review"
    folder: "src/content/reviews"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    summary: "{{name}} — {{rating}}★"
    sortable_fields: ["order", "name", "rating"]
    fields:
      - { name: name, label: "Customer Name", widget: string }
      - { name: order, label: "Display Order", widget: number, value_type: int, default: 10 }
      - { name: rating, label: "Star Rating", widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - name: source
        label: "Source"
        widget: select
        options: ["Yelp", "Google", "Facebook", "Better Business Bureau", "In Shop"]
        default: "Yelp"
      - { name: featured, label: "Show in Home Page Slider", widget: boolean, default: true }
      - { name: quote, label: "Review Text", widget: text }

  # ------------------------------------------------------------------
  # FAQS
  # ------------------------------------------------------------------
  - name: faqs
    label: "FAQs"
    label_singular: "FAQ"
    folder: "src/content/faqs"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    summary: "{{question}}"
    sortable_fields: ["order", "question"]
    fields:
      - { name: order, label: "Display Order", widget: number, value_type: int, default: 10 }
      - { name: question, label: "Question", widget: string }
      - { name: answer, label: "Answer", widget: text }
